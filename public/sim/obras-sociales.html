<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cobertura de obra social (simulación) | Turnos Odontología</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
    }
    .aviso-sim {
      margin: 0;
      padding: 12px 16px;
      background: var(--t-urg);
      color: var(--t-urg-fg);
      font-weight: 700;
      text-align: center;
      letter-spacing: .02em;
    }
    main {
      max-width: 480px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
    }
    h1 {
      margin: 0 0 4px;
      font-family: var(--font-display);
      font-size: 1.5rem;
    }
    .sub { margin: 0 0 20px; color: var(--muted); }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      background: var(--bg);
      color: var(--ink);
    }
    button {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #resultado { margin: 20px 0 0; min-height: 1.5em; font-weight: 600; }
    #resultado.ok { color: var(--ok); }
    #resultado.error { color: var(--alert); }
    dl { margin: 16px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-weight: 600; word-break: break-all; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .chips button { width: auto; min-height: 36px; margin: 0; padding: 0 12px; font-size: .875rem; }
    .nav { margin: 20px 0 0; font-size: .875rem; }
    .nav a { color: var(--accent); }
  </style>
</head>
<body>
  <p class="aviso-sim" role="note">SIMULACIÓN — consulta de cobertura simulada, sin padrón real</p>
  <main>
    <section class="card" aria-labelledby="titulo">
      <h1 id="titulo">Consultar cobertura</h1>
      <p class="sub">Padrón ficticio local: no se contacta ninguna obra social ni servicio externo.</p>
      <form id="formulario">
        <label for="nro">Número de afiliado</label>
        <input id="nro" name="nro" type="text" placeholder="AF-0001" autocomplete="off">
        <button type="submit">Consultar</button>
      </form>
      <div id="afiliados" class="chips" aria-label="Afiliados del padrón simulado"></div>
      <p id="resultado" role="status" aria-live="polite"></p>
      <dl id="detalle" hidden>
        <dt>Obra social</dt>
        <dd id="obra-social">—</dd>
        <dt>Plan</dt>
        <dd id="plan">—</dd>
        <dt>Cobertura</dt>
        <dd id="cobertura">—</dd>
        <dt>Copago</dt>
        <dd id="copago">—</dd>
        <dt>Estado</dt>
        <dd id="estado-afiliado">—</dd>
      </dl>
      <p class="nav"><a href="/admin/#/clientes">Clientes</a> · <a href="/admin/#/configuracion">Configuración</a> · <a href="/bot.html">Bot de WhatsApp</a></p>
    </section>
  </main>

  <script>
    (function () {
      const CABECERAS = { 'X-Rol': 'recepcion', 'X-Usuario': 'u-recepcion' };
      const formulario = document.getElementById('formulario');
      const nro = document.getElementById('nro');
      const resultado = document.getElementById('resultado');
      const detalle = document.getElementById('detalle');
      const afiliados = document.getElementById('afiliados');
      let padron = { obrasSociales: [], afiliados: [] };

      function mostrar(texto, tipo) {
        resultado.textContent = texto;
        resultado.className = tipo;
      }

      function limpiar() {
        detalle.hidden = true;
        document.getElementById('obra-social').textContent = '—';
        document.getElementById('plan').textContent = '—';
        document.getElementById('cobertura').textContent = '—';
        document.getElementById('copago').textContent = '—';
        document.getElementById('estado-afiliado').textContent = '—';
      }

      function cargarPadron() {
        return fetch('/api/sim/obras-sociales/padron', { headers: CABECERAS })
          .then(function (res) { return res.ok ? res.json() : { obrasSociales: [], afiliados: [] }; })
          .then(function (datos) {
            padron = datos;
            afiliados.replaceChildren();
            padron.afiliados.forEach(function (a) {
              const b = document.createElement('button');
              b.type = 'button';
              b.textContent = a.nroAfiliado + (a.estado === 'error_simulado' ? ' (falla sim.)' : '');
              b.addEventListener('click', function () {
                nro.value = a.nroAfiliado;
                consultar(a.nroAfiliado);
              });
              afiliados.appendChild(b);
            });
          })
          .catch(function () { mostrar('No se pudo cargar el padrón simulado.', 'error'); });
      }

      async function consultar(valor) {
        limpiar();
        if (valor === '') {
          mostrar('Ingresá un número de afiliado ficticio, por ejemplo AF-0001.', 'error');
          return;
        }
        try {
          const res = await fetch('/api/sim/obras-sociales/afiliados/' + encodeURIComponent(valor), { headers: CABECERAS });
          const cuerpo = await res.json();
          if (!res.ok) {
            const error = cuerpo.error || {};
            mostrar((error.regla ? error.regla + ' — ' : '') + (error.mensaje || 'No se pudo consultar el padrón simulado.'), 'error');
            return;
          }
          const obra = padron.obrasSociales.find(function (o) { return o.codigo === cuerpo.obraSocial; });
          document.getElementById('obra-social').textContent = obra ? cuerpo.obraSocial + ' · ' + obra.nombre : cuerpo.obraSocial;
          document.getElementById('plan').textContent = cuerpo.plan;
          document.getElementById('cobertura').textContent = cuerpo.cobertura + '%';
          document.getElementById('copago').textContent = cuerpo.copagoPct + '%';
          document.getElementById('estado-afiliado').textContent = cuerpo.estado;
          detalle.hidden = false;
          mostrar('Consulta simulada: ' + cuerpo.aviso, 'ok');
        } catch (e) {
          mostrar('No se pudo contactar al servidor local.', 'error');
        }
      }

      formulario.addEventListener('submit', function (evento) {
        evento.preventDefault();
        consultar(nro.value.trim());
      });

      cargarPadron();
    })();
  </script>
</body>
</html>
