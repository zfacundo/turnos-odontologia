
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Odontológica</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 24px;
    background: #f5f7fa;
    color: #243044;
  }

  main {
    display: grid;
    grid-template-columns: minmax(0, 3fr) minmax(220px, 1fr);
    gap: 20px;
  }

  section, aside {
    background: white;
    padding: 18px;
    border-radius: 12px;
  }

  .controles-agenda {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 20px 0;
  }

  #grilla-agenda {
    overflow-x: auto;
  }

  .tabla-agenda {
    border-collapse: collapse;
    width: 100%;
    min-width: 420px;
  }

  .tabla-agenda td {
    border: 1px solid #ddd;
    padding: 8px;
    min-width: 110px;
    font-size: 13px;
  }

  .tabla-agenda thead {
    background: #e6edf7;
    font-weight: bold;
  }

  .turno {
    background: #dbeafe;
    border-left: 4px solid #2563eb;
    padding: 7px;
    border-radius: 5px;
    margin: 3px 0;
  }

  .horario-pasado {
    background: #f0f0f0;
    opacity: 0.55;
  }

  @media (max-width: 800px) {
    main {
      grid-template-columns: 1fr;
    }
  }

.panel-formulario {
  margin: 20px 0;
  padding: 18px;
  border: 1px solid #dbe3ee;
  border-radius: 10px;
  background: #f8fafc;
}

#form-nuevo-turno {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 12px;
  margin-top: 15px;
}

#form-nuevo-turno label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 14px;
}

input, select, button {
  padding: 9px;
  border: 1px solid #ccd5e0;
  border-radius: 6px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

#resultado-turno {
  margin-top: 12px;
  font-weight: bold;
}

/* Agenda visual */

#grilla-agenda {
  overflow: auto;
  max-height: 650px;
  border: 1px solid #dbe3ee;
  border-radius: 10px;
}

.calendario-grid {
  display: grid;
  position: relative;
  width: 100%;
  background: white;
}

.encabezado-dia {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #dbeafe;
  color: #1e3a5f;
  font-weight: bold;
  border: 1px solid #c4d4e8;
}

.eje-hora {
  position: sticky;
  left: 0;
  z-index: 4;
  background: #f1f5f9;
  padding: 10px 6px;
  font-size: 12px;
  font-weight: bold;
  border-bottom: 1px solid #dbe3ee;
}

.celda-horaria {
  border-right: 1px solid #e2e8f0;
  border-bottom: 1px solid #e2e8f0;
}

.celda-pasada {
  background: #f1f1f1;
}

.turno-bloque {
  position: relative;
  z-index: 3;
  box-sizing: border-box;
  overflow: hidden;
  white-space: pre-line;
  margin: 2px;
  padding: 6px;
  font-size: 12px;
  line-height: 1.35;
  border-radius: 6px;
  border-left: 4px solid #64748b;
  background: #e2e8f0;
  color: #1e293b;
}

.turno-pasado {
  opacity: 0.55;
}

/* Colores por prestación */

.tipo-prest-control {
  background: #dbeafe;
  border-color: #2563eb;
}

.tipo-prest-orto {
  background: #ede9fe;
  border-color: #7c3aed;
}

.tipo-prest-trat {
  background: #dcfce7;
  border-color: #16a34a;
}

.tipo-prest-est {
  background: #fce7f3;
  border-color: #db2777;
}

.tipo-prest-urg {
  background: #fee2e2;
  border-color: #dc2626;
}

button.activo {
  background: #0f172a;
}

</style>

</head>
<body>

  <header>
    <h1>Agenda Odontológica</h1>
    <p>Gestión de turnos del consultorio</p>
  </header>

  <main>
    <section>
      <h2>Agenda de turnos</h2>

      <button id="vista-dia">Día</button>
      <button id="vista-semana">Semana</button>

<div class="panel-formulario">
  <h3>Nuevo turno</h3>

  <label>
    Rol simulado:
    <select id="rol-simulado">
      <option value="recepcion">Recepción</option>
      <option value="admin">Administrador</option>
      <option value="odontologo">Odontólogo</option>
    </select>
  </label>

  <form id="form-nuevo-turno">
    <label>
      Paciente:
      <select id="nuevo-paciente" required>
        <option value="pac-01">Paciente 01</option>
        <option value="pac-02">Paciente 02</option>
        <option value="pac-03">Paciente 03</option>
      </select>
    </label>

    <label>
      Profesional:
      <select id="nuevo-profesional" required>
        <option value="prof-1">Profesional 1</option>
        <option value="prof-2">Profesional 2</option>
      </select>
    </label>

    <label>
      Sillón:
      <select id="nuevo-sillon" required>
        <option value="sillon-1">Sillón 1</option>
        <option value="sillon-2">Sillón 2</option>
      </select>
    </label>

    <label>
      Prestación:
      <select id="nueva-prestacion" required>
        <option value="prest-control">Control</option>
        <option value="prest-orto">Ortodoncia</option>
        <option value="prest-trat">Tratamiento</option>
      </select>
    </label>

    <label>
      Fecha y hora:
      <input
        type="datetime-local"
        id="nuevo-inicio"
        step="900"
        required
      >
    </label>

    <button type="submit">Crear turno</button>
  </form>

  <p id="resultado-turno" role="status"></p>
</div>

      <div id="agenda">
        Aquí mostraremos los turnos.
      </div>
    </section>

    <aside>
      <h2>Lo que hizo el sistema</h2>
      <div id="registro">
        Aquí mostraremos los eventos.
      </div>
<button id="actualizar-registro" type="button">
  Actualizar registro
</button>
    </aside>
   </main>

  <script src="/js/api.js"></script>
  <script src="/js/agenda.js"></script>
</body>
</html>
